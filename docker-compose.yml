# Single-service Next.js app (UI + API in one process).
#
# Patient data is held in the container's memory and resets when the container
# restarts. Wire up Supabase Postgres in lib/server/database.ts for persistence.
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
    restart: unless-stopped
